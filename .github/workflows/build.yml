name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace (Windows)
        run: cargo build --release --workspace

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cozip-windows-x64
          path: |
            target/release/cozip.exe
            target/release/cozip_desktop.exe
            target/release/*.dll

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace (Linux)
        run: cargo build --release --workspace

      - name: Test Workspace (Linux)
        run: cargo test --workspace

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cozip-linux-x64
          path: |
            target/release/cozip
            target/release/cozip_desktop
