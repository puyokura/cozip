name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace (Windows)
        run: cargo build --release --workspace

      - name: Package Release ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path staging\icons
          Copy-Item target\release\cozip.exe staging\
          Copy-Item target\release\cozip_desktop.exe staging\
          Copy-Item target\release\cozip_win_shell.dll staging\
          Copy-Item target\release\cozip_win_uninstaller.exe staging\
          if (Test-Path src\cozip_win_shell\icons) { Copy-Item src\cozip_win_shell\icons\* staging\icons\ }
          Compress-Archive -Path staging\* -DestinationPath target\release\pack.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cozip-windows-x64
          path: |
            target/release/cozip_win_installer.exe
            target/release/cozip_win_uninstaller.exe
            target/release/cozip_desktop.exe
            target/release/cozip.exe
            target/release/cozip_win_shell.dll
            target/release/pack.zip

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace (Linux)
        run: cargo build --release --package cozip --package cozip_pdeflate --package cozip_deflate --package cozip_util --package cozip_desktop

      - name: Test Workspace (Linux)
        run: cargo test --package cozip --package cozip_pdeflate --package cozip_deflate --package cozip_util

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cozip-linux-x64
          path: |
            target/release/cozip
            target/release/cozip_desktop
